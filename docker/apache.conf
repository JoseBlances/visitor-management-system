# Apache site for the hosted server (Dockerfile). The site answers on Railway's $PORT;
# HTTPS is handled by Railway in front of it.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# A small campus system: cap the number of simultaneous PHP workers so memory (and the
# hosting bill) stays predictable. These override Debian's mpm_prefork.conf, read earlier.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 6
    MaxRequestWorkers 40
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # The .htaccess files carry the security headers and keep config, tools,
        # and uploads private, so they must be honored.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Railway's health checks would otherwise fill the access log.
    SetEnvIf Request_URI "^/phone_tracker/api/v1/health\.php$" isatu_health_check
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined env=!isatu_health_check
</VirtualHost>
