<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | ISATU Visitor Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <header class="auth-header">
        <div class="auth-brand" aria-label="ISATU Visitor Management System">
            <span class="auth-brand-mark" aria-hidden="true">
                <img src="assets/images/isatu-logo.png" alt="">
            </span>
            <span class="auth-brand-name">ISATU Visitor Management System</span>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-live="polite">
            <div class="auth-panel auth-panel-login" id="signInPanel">
                <h1 class="auth-panel-title">LOG IN</h1>

                <form id="loginForm" class="auth-form" action="login.php" method="post">
                    <div class="auth-field">
                        <input type="text" id="loginEmail" name="username" autocomplete="username" inputmode="email" placeholder=" " required>
                        <label for="loginEmail">Email</label>
                    </div>

                    <div class="auth-field">
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder=" " required>
                        <label for="loginPassword">Password</label>
                    </div>

                    <p class="auth-message" id="loginMessage" role="alert" hidden></p>
                </form>

                <p class="auth-switch">New here? <button class="auth-text-button" id="showRegisterBtn" type="button">Create Account</button></p>
                <button class="auth-submit" id="signInBtn" type="submit" form="loginForm">Log In</button>
            </div>

            <div class="auth-panel auth-panel-register" id="registerPanel" hidden>
                <h1 class="auth-panel-title">SIGN UP</h1>

                <form id="registerForm" class="auth-form" action="register.php" method="post">
                    <div class="auth-field">
                        <input type="text" id="regFullName" name="full_name" autocomplete="name" maxlength="100" placeholder=" " required>
                        <label for="regFullName">Full Name</label>
                    </div>

                    <div class="auth-field">
                        <input type="email" id="regEmail" name="email" autocomplete="email" maxlength="64" placeholder=" " required>
                        <label for="regEmail">Email</label>
                    </div>

                    <div class="auth-field">
                        <select id="regRole" name="role" required>
                            <option value="office">Office Personnel</option>
                            <option value="staff">Security Personnel</option>
                        </select>
                        <label for="regRole">Account Type</label>
                    </div>

                    <div class="auth-field" id="officeAssignment" hidden>
                        <select id="regOfficeCode" name="office_code">
                            <option value="CCI">CCI Computing and Informatics</option>
                            <option value="COED">COED Education</option>
                            <option value="CEA">CEA Engineering and Architecture</option>
                            <option value="CIT">CIT Industrial Technology</option>
                            <option value="CAS">CAS Arts and Sciences</option>
                        </select>
                        <label for="regOfficeCode">Office</label>
                    </div>

                    <div class="auth-field">
                        <input type="password" id="regPassword" name="password" autocomplete="new-password" minlength="8" placeholder=" " required>
                        <label for="regPassword">Password</label>
                    </div>

                    <p class="auth-message" id="registerMessage" role="alert" hidden></p>
                </form>

                <p class="auth-switch">Already have an account? <button class="auth-text-button" id="showSignInBtn" type="button">Log In</button></p>
                <button class="auth-submit" id="registerBtn" type="submit" form="registerForm">Sign Up</button>
            </div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script>
        (function () {
            var redirects = {
                security: "dashboard.html",
                visitor: "index.html",
                offices: "offices.html",
                admin: "admin.html",
            };

            var signInPanel = document.getElementById("signInPanel");
            var registerPanel = document.getElementById("registerPanel");
            var loginForm = document.getElementById("loginForm");
            var registerForm = document.getElementById("registerForm");
            var loginMessage = document.getElementById("loginMessage");
            var registerMessage = document.getElementById("registerMessage");
            var signInBtn = document.getElementById("signInBtn");
            var registerBtn = document.getElementById("registerBtn");
            var regRole = document.getElementById("regRole");
            var officeAssignment = document.getElementById("officeAssignment");
            var regOfficeCode = document.getElementById("regOfficeCode");

            function showMessage(element, message, state) {
                element.textContent = message || "";
                element.hidden = !message;
                if (message) {
                    element.dataset.state = state || "error";
                } else {
                    delete element.dataset.state;
                }
            }

            function redirectToRole(role) {
                var target = redirects[role] || "index.html";
                var separator = target.indexOf("?") === -1 ? "?" : "&";
                window.location.href = target + separator + "role=" + encodeURIComponent(role);
            }

            function syncOfficeAssignment() {
                var isOfficePersonnel = regRole.value === "office";
                officeAssignment.hidden = !isOfficePersonnel;
                regOfficeCode.required = isOfficePersonnel;
                if (!isOfficePersonnel) {
                    regOfficeCode.value = "";
                }
            }

            function showSignIn(message) {
                registerPanel.hidden = true;
                signInPanel.hidden = false;
                showMessage(registerMessage, "");
                showMessage(loginMessage, message || "", message ? "success" : "");
                window.setTimeout(function () {
                    document.getElementById("loginEmail").focus();
                }, 0);
            }

            function showRegister() {
                signInPanel.hidden = true;
                registerPanel.hidden = false;
                showMessage(loginMessage, "");
                showMessage(registerMessage, "");
                window.setTimeout(function () {
                    document.getElementById("regFullName").focus();
                }, 0);
            }

            document.getElementById("showRegisterBtn").addEventListener("click", showRegister);
            document.getElementById("showSignInBtn").addEventListener("click", function () {
                showSignIn();
            });
            regRole.addEventListener("change", syncOfficeAssignment);
            syncOfficeAssignment();

            fetch("session_status.php", { credentials: "same-origin" })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (!data || !data.authenticated || !data.role) {
                        return;
                    }
                    PhoneTrackerAuth.setSessionFromLogin(data);
                    redirectToRole(data.role);
                })
                .catch(function () {});

            loginForm.addEventListener("submit", function (event) {
                event.preventDefault();
                showMessage(loginMessage, "");

                var username = document.getElementById("loginEmail").value.trim();
                var password = document.getElementById("loginPassword").value;
                if (!username || !password) {
                    showMessage(loginMessage, "Enter your email and password.");
                    return;
                }

                signInBtn.disabled = true;
                fetch("login.php", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: username, password: password }),
                })
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {
                        if (!data || !data.success) {
                            showMessage(loginMessage, (data && data.message) || "Log in failed.");
                            return;
                        }
                        PhoneTrackerAuth.setSessionFromLogin(data);
                        redirectToRole(data.role);
                    })
                    .catch(function () {
                        showMessage(loginMessage, "Could not reach the server. Open this page through your local PHP server.");
                    })
                    .finally(function () {
                        signInBtn.disabled = false;
                    });
            });

            registerForm.addEventListener("submit", function (event) {
                event.preventDefault();
                showMessage(registerMessage, "");

                var fullName = document.getElementById("regFullName").value.trim();
                var email = document.getElementById("regEmail").value.trim();
                var contactNumber = document.getElementById("regContact").value.replace(/\D/g, "");
                var password = document.getElementById("regPassword").value;
                var role = regRole.value;
                var officeCode = regOfficeCode.value;

                if (!fullName || !email || !contactNumber || !password || !role) {
                    showMessage(registerMessage, "Complete all required fields.");
                    return;
                }
                if (!/^\d{10}$/.test(contactNumber)) {
                    showMessage(registerMessage, "Enter a 10-digit Philippine contact number after +63.");
                    return;
                }
                if (role === "office" && !officeCode) {
                    showMessage(registerMessage, "Choose the college for this office account.");
                    return;
                }

                registerBtn.disabled = true;
                fetch("register.php", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: email,
                        password: password,
                        display_name: fullName,
                        contact_number: contactNumber,
                        role: role,
                        office_code: officeCode,
                    }),
                })
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {
                        if (!data || !data.success) {
                            showMessage(registerMessage, (data && data.message) || "Sign up failed.");
                            return;
                        }
                        registerForm.reset();
                        syncOfficeAssignment();
                        document.getElementById("loginEmail").value = email;
                        showSignIn(data.message || "Account created. You can log in now.");
                    })
                    .catch(function () {
                        showMessage(registerMessage, "Could not reach the server. Open this page through your local PHP server.");
                    })
                    .finally(function () {
                        registerBtn.disabled = false;
                    });
            });
        })();
    </script>
</body>
</html>
